services:
  - type: web
    name: whatsapp-reminder
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set securely in Render dashboard
      - key: DB_NAME
        value: whatsapp_reminder
